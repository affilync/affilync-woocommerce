; IonCube Encoder Configuration for Affilync WooCommerce Plugin
; Version: 1.0.0
; Documentation: https://www.ioncube.com/encoder_user_guide.php

[Encoder Settings]
; Target PHP version
php_target_version = 7.4

; Encoding strength (maximum obfuscation)
encode_level = 6

; Enable all obfuscation features
obfuscate_function_names = yes
obfuscate_class_names = yes
obfuscate_constant_names = yes
obfuscate_property_names = yes

; String encryption
encrypt_all_strings = yes

; Control flow obfuscation
obfuscate_control_flow = yes
add_opaque_predicates = yes

; Remove comments and whitespace
remove_comments = yes
remove_phpdoc = yes

[License Settings]
; Enable server-side license validation
license_check = yes
license_server = https://api.affilync.com/api/woocommerce/licenses/callback

; License file settings
passphrase = ${IONCUBE_PASSPHRASE}
expire_on = property license
expire_in_grace_period = 3

; Callback on license failure
on_license_failure = disable

; Domain binding
enforce_domain_binding = yes

[Output Settings]
; Output directory
output_dir = ./dist

; Keep directory structure
keep_source_dir_structure = yes

; PHP short tags handling
short_tags = yes

; Binary safety
binary_safety = yes

[File Patterns]
; Files to encode (relative to source directory)
encode_files = *.php

; Directories to encode
encode_dirs = includes

; Files to exclude from encoding
exclude_files = uninstall.php
exclude_files = includes/index.php
exclude_files = includes/*/index.php

; Directories to exclude
exclude_dirs = assets
exclude_dirs = languages
exclude_dirs = templates
exclude_dirs = build
exclude_dirs = tests
exclude_dirs = vendor

[Callback Settings]
; Remote license verification
callback_url = https://api.affilync.com/api/woocommerce/licenses/validate
callback_interval = 86400

; On callback failure
on_callback_failure = continue_with_grace

[Error Handling]
; Custom error messages
loader_not_installed_message = "Affilync requires the IonCube Loader to be installed. Please visit https://www.ioncube.com/loaders.php for installation instructions."
license_expired_message = "Your Affilync license has expired. Please visit https://affilync.com/account to renew."
license_invalid_message = "Invalid Affilync license. Please contact support at support@affilync.com"

[Advanced]
; Dynamic keys (regenerated per build)
use_dynamic_keys = yes

; Loader version requirement
minimum_loader_version = 10.0

; PHP function blacklist (prevent certain functions in encoded files)
; This helps prevent debugging/decompilation attempts
allow_function_reflection = no
allow_function_debug_backtrace = limited
